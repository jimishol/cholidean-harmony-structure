# .github/workflows/build-udp-midi-binaries.yml
name: Build UDP-MIDI Bridge Binaries

on:
  workflow_dispatch:
    inputs:
      buildLinux:
        description: 'Build Linux x64'
        required: false
        default: true
        type: boolean
      buildMac:
        description: 'Build macOS universal'
        required: false
        default: true
        type: boolean
      buildWindows:
        description: 'Build Windows x64'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install deps
        working-directory: asset_pipeline/udpMidi
        run: npm ci

      - name: Prepare binaries folder
        run: |
          rm -rf src/backends/udpMidi/binaries
          mkdir -p src/backends/udpMidi/binaries

      - name: Build Linux binary
        if: ${{ github.event.inputs.buildLinux == 'true' }}
        working-directory: asset_pipeline/udpMidi
        run: |
          npx pkg . \
            --targets node18-linux-x64 \
            --output ../../src/backends/udpMidi/binaries/udp-midi-bridge-linux

      - name: Build macOS binary
        if: ${{ github.event.inputs.buildMac == 'true' }}
        working-directory: asset_pipeline/udpMidi
        run: |
          npx pkg . \
            --targets node18-macos-x64,node18-macos-arm64 \
            --output ../../src/backends/udpMidi/binaries/udp-midi-bridge-macos

      - name: Build Windows binary
        if: ${{ github.event.inputs.buildWindows == 'true' }}
        working-directory: asset_pipeline/udpMidi
        run: |
          npx pkg . \
            --targets node18-win-x64 \
            --output ../../src/backends/udpMidi/binaries/udp-midi-bridge-windows.exe

      - name: Package all binaries
        run: |
          cd src/backends/udpMidi
          zip -j udp-midi-bridge-binaries.zip binaries/*

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: udp-midi-bridge-binaries
          path: src/backends/udpMidi/udp-midi-bridge-binaries.zip
